[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codex-local"
version = "0.1.0"
description = "Run Codex on your own local model without changing a line of Codex configuration."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "The Codex Local Authors" }]
keywords = [
    "codex",
    "local-llm",
    "mlx",
    "mitmproxy",
    "openai",
    "inference",
    "proxy",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Software Development :: Testing",
]

# Codex Local itself is pure standard library. mitmproxy is required at runtime but
# is invoked as an external binary (`mitmdump`) running its own interpreter, so
# it is deliberately not a Python dependency of this package.
dependencies = []

[project.scripts]
codex-local = "codex_local.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_local"]
